<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070a0f">
  <title>Trading Ninja — accès</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
</head>
<body class="login-page">
  <main class="login">
    <h1>TRADING NINJA</h1>
    <p class="muted">Supervision — accès restreint</p>
    <form method="post" action="/login">
      <label>
        Mot de passe
        <input type="password" name="password" required autocomplete="current-password"
               autofocus>
      </label>
      <label>
        Code Authy
        <input type="text" name="totp" inputmode="numeric" pattern="[0-9]{6}"
               maxlength="6" required autocomplete="one-time-code" placeholder="123456">
      </label>
      <p id="login-error" class="error" hidden>
        Identifiants refusés. Vérifier le mot de passe et le code courant.
      </p>
      <button type="submit">Entrer</button>
    </form>
    <p class="footer">Deux facteurs · session de 7 jours</p>
  </main>
  <script src="/app.js" defer></script>
</body>
</html>
